name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # A subset of the runtime requirements on purpose. The suite is CPU-only
      # and touches no network, no GPU, and none of the large artefacts, so the
      # CUDA build of torch would be ~2 GB of download for nothing. h5py and
      # requests are not reached by any test.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers pandas pyarrow numpy scipy scikit-learn pyyaml pytest
          pip install fastapi httpx   # serving-path tests use TestClient

      - name: Run tests
        run: python -m pytest tests -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: "front end/web"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: "front end/web/package-lock.json"

      - run: npm ci

      # `build` is `vue-tsc -b && vite build`, so this typechecks as well as
      # compiles. Nothing else ran either until now.
      - run: npm run build

      - run: npm run test
